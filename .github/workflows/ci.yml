name: CI - Lint, Type-Check & Build Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: Verify Frontend & API Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Type-Check Frontend
        run: npm run type-check

      - name: Build Frontend
        run: npm run build

      - name: Install & Compile API Functions
        working-directory: ./api
        run: |
          npm ci
          npm run build

